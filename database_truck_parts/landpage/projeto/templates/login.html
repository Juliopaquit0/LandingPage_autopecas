<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Truck Parts</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        font-family: Arial, Helvetica, sans-serif;

        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
          url("{{ url_for('static', filename='imagens/scania124.jpg') }}")
            center / cover no-repeat fixed;
      }

      .login-box {
        width: 90%;

        max-width: 380px;

        background: rgba(255, 255, 255, 0.97);

        border-radius: 16px;

        overflow: hidden;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      .topo {
        background: #e30613;

        color: white;

        text-align: center;

        padding: 28px;
      }

      .topo h1 {
        margin: 0;

        font-size: 27px;
      }

      .topo p {
        margin: 8px 0 0;

        opacity: 0.9;
      }

      form {
        padding: 28px;
      }

      .grupo {
        margin-bottom: 18px;
      }

      label {
        display: block;

        margin-bottom: 7px;

        font-weight: bold;

        font-size: 13px;

        color: #333;
      }

      input {
        width: 100%;

        padding: 13px;

        border: 1px solid #d5d5d5;

        border-radius: 8px;

        outline: none;

        font-size: 14px;
      }

      input:focus {
        border-color: #e30613;

        box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.1);
      }

      button {
        width: 100%;

        padding: 13px;

        border: none;

        border-radius: 8px;

        background: #e30613;

        color: white;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
      }

      button:hover {
        background: #b9000c;

        transform: translateY(-2px);
      }

      .cadastro {
        display: block;

        text-align: center;

        margin-top: 18px;

        color: #e30613;

        text-decoration: none;

        font-weight: bold;

        font-size: 14px;
      }

      .cadastro:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <div class="topo">
        <h1>Truck Parts</h1>

        <p>Acesse sua conta</p>
      </div>

      <form action="{{ url_for('fazer_login') }}" method="post">
        <div class="grupo">
          <label for="email"> E-mail </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
          />
        </div>

        <div class="grupo">
          <label for="senha"> Senha </label>

          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit">Entrar</button>

        <a href="{{ url_for('cadastro') }}" class="cadastro">
          Ainda não tenho cadastro
        </a>
      </form>
    </div>
  </body>
</html>
